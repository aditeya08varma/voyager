name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 build-essential

      - name: Install Python dependencies
        run: |
          pip install --no-cache-dir "setuptools<75" wheel
          pip install --no-cache-dir --no-build-isolation -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v
